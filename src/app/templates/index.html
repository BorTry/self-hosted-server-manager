{% from "modules/gauges.html" import gauges %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

        <link rel="stylesheet" href="{{ url_for('static', filename='css/standard.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/frontpage/index.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/modules/gauge.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/modules/dropdown.css') }}">

        <script type="module" src="{{ url_for('static', filename='js/modules/dropdown.js') }}"></script>
        <script type="module" src="{{ url_for('static', filename='js/frontpage/index.js') }}" defer></script>
    </head>
    <body>
        <div id="header" class="main-body shadow round-border"></div>
        <div id="body" class="main-body transparent-background">
            <div id="server-list">
                {% for server_name in server_names %}
                    <div class="dropdown-container shadow round-border">
                        <div class="dropdown-title">
                            <div class="dropdown-image">
                                <img id="{{ server_name }}-image" src="/static/images/{{ server_name }}.jpg">
                                <div class="image-gradient"></div>
                            </div>
                        </div>
                        <div class="dropdown">
                            <div class="content-container">
                                {{ gauges(["cpu", "ram"], server_name) }}
                                <div class="form-container full-size">
                                    <form for="{{ server_name }}" id="{{ server_name }}-form" class="server-form full-size">
                                        <div class="inner-form-container" id="{{ server_name }}-form-container"></div>
                                        <div class="button-container">
                                            <button type="submit" name="start" class="round-border shadow">
                                                Start Server
                                            </button>
                                            <button type="submit" name="stop" class="stop_button round-border shadow">
                                                Stop Server
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
        <div id="footer" class="main-body shadow round-border"></div>
    </body>
</html>
