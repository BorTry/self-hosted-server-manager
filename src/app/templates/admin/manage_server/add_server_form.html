{% macro add_server_form() %}
    <form id="add_server_form" class="round-border">
        <div>
            <div class="inner-form-container">
                <div class="text-container">
                    <div>
                        <label for="server_name">Server Name:</label>
                        <input id="server_name" name="server_name" type="text" required>
                    </div>
                    <div id="port-list"></div>
                    <button type="button" class="circle-button add" id="port-add-button">
                        <p>+</p>
                    </button>
                </div>  
            </div>
        <div class="divider"></div>
        </div>
        <div>
            <div class="inner-form-container check-list">
                <label for="strict_ports">Strict ports:</label>
                <input id="strict_ports" name="strict_ports" type="checkbox">
                <span title="The server will try allocate a free port on the host maching if the given port is in use">ⓘ</span>

                <label for="forward_ports">Try to port forwards:</label>
                <input id="forward_ports" name="forwards_ports" type="checkbox" checked>
                <span title="If the server will attempt portforwarding with your router">ⓘ</span>

                <label for="steam_server">Steam server:</label>
                <input id="steam_server" name="steam_server" type="checkbox">
                <span title="Is the server a steam server">ⓘ</span>

                <label for="steam_id">Steam id:</label>
                <input id="steam_id" name="steam_id" type="text" disabled>
                <span title="Steam Id for the game server">ⓘ</span>
            </div>
        </div>
        <div>
            <div class="inner-form-container slider-list">
                <div>
                    <label for="cpu_limit">Cpu cores:</label>
                    <input id="cpu_limit" name="cpu_limit" type="range" min="1" max="6" step="1" value="2">
                    <output id="out_cpu_limit">2 Cores</output>
                </div>
                <div>
                    <label for="ram_limit">Ram limit:</label>
                    <input id="ram_limit" name="ram_limit" type="range" min="0.25" max="16" step="0.25" value="2">
                    <output id="out_ram_limit">2GB</output>
                </div>
            </div>
            <div class="divider"></div>
        </div>
        <div>
            <div class="inner-form-container">
                <div class="text-container">
                    <label for="launch_opt">Launch command:</label>
                    <textarea type="text" id="launch_opt" name="launch_opt" type="text" class="text_input"></textarea>
                    <label for="install_opt">Install command:</label>
                    <textarea type="text" id="install_opt" name="install_opt" type="text" class="text_input"></textarea>
                </div>
            </div>
        </div>
        <div>
            <div class="inner-form-container">
                <div>
                    <label for="image">Choose an image:</label>
                    <input type="file" id="image" name="image" accept="image/png, image/jpeg">
                </div>
            </div>
            <div class="divider"></div>
        </div>
        <div>
            <button type="submit" value="">Add server</button>
        </div>
    </form>
{% endmacro %}
