name: servers

services: 
  minecraft:
    container_name: minecraft_server
    ports: 
      - 25565:80
    build: 
      context: ../buildfiles
      dockerfile: Dockerfile.minecraft
    volumes: 
      - ${SERVER_DATA_PATH}/minecraft:/data
    entrypoint: 
      - /entrypoint.sh
    working_dir: /data
    cpus: 6.0
    mem_limit: 6GB
    command: java -Xmx6G -jar fabric-server-mc.1.21.11-loader.0.18.4-launcher.1.1.1.jar nogui

  modded_minecraft:
    container_name: modded_minecraft_server
    ports: 
      - 25566:80
    build: 
      context: ../buildfiles
      dockerfile: Dockerfile.minecraft
    volumes: 
      - ${SERVER_DATA_PATH}/modded_minecraft:/data
    entrypoint: 
      - /entrypoint.sh
    working_dir: /data
    cpus: 6.0
    mem_limit: 6GB

  factorio:
    container_name: factorio_server
    ports: 
      - 34197:34197/udp
    build: 
      context: ../buildfiles
      dockerfile: Dockerfile.factorio
    volumes: 
      - ../../../server_data/factorio:/data
      - ${SERVER_DATA_PATH}/factorio:/data
    entrypoint: 
      - /entrypoint.sh
    working_dir: /data
    environment: 
      SEED_SCRIPT: wget -P /tmp/ https://factorio.com/get-download/stable/headless/linux64 && tar -xf /tmp/linux64 -C /data/ && /data/factorio/bin/x64/factorio --create /data/saves/my-save.zip
    cpus: 4.0
    mem_limit: 4GB
    command: factorio/bin/x64/factorio --start-server ./saves/my-save.zip

  factorio_space_age:
    container_name: factorio_space_age_server
    ports: 
      - 34198:34197/udp
    build: 
      context: ../buildfiles
      dockerfile: Dockerfile.factorio
    volumes: 
      - ${SERVER_DATA_PATH}/factorio_space_age:/data
    entrypoint: 
      - /entrypoint.sh
    working_dir: /data

  space_engineers:
    container_name: space_engineers_server
    image: base_image
    volumes: 
      - ${SERVER_DATA_PATH}/space_engineers:/data
    entrypoint: 
      - /entrypoint.sh
    working_dir: /data

  satisfactory:
    container_name: satisfactory_server
    image: base_image
    volumes: 
      - ${SERVER_DATA_PATH}/satisfactory:/data
    entrypoint: 
      - /entrypoint.sh
    working_dir: /data

  astroneers:
    container_name: astroneers_server
    image: base_image
    volumes: 
      - ${SERVER_DATA_PATH}/astroneers:/data
    entrypoint: 
      - /entrypoint.sh
    working_dir: /data

  screeps:
    container_name: screeps_server
    image: base_image
    volumes: 
      - ${SERVER_DATA_PATH}/screeps:/data
    entrypoint: 
      - /entrypoint.sh
    working_dir: /data

