name: "docker_server"

services:
  minecraft:
    container_name: minecraft_server
    ports:
      - "25565:80"
    volumes: ["../mine_server:/data"]
    working_dir: /data
    build:
      context: ./buildfiles
      dockerfile: Dockerfile.minecraft
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: 6.0
    tty: true
    command: "java -Xmx6G -jar fabric-server-mc.1.21.11-loader.0.18.4-launcher.1.1.1.jar nogui"

  modded_minecraft:
    container_name: modded_minecraft_server
    ports:
      - "25566:80"
    build:
      context: ./buildfiles
      dockerfile: Dockerfile.minecraft
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: 6.0
    tty: true

  space_engineers:
    container_name: space_engineers_server
    build:
      context: ./buildfiles
      dockerfile: Dockerfile.java
    tty: true

  factorio:
    container_name: factorio_server
    build:
      context: ./buildfiles
      dockerfile: Dockerfile.factorio
    user: "factorio:factorio"
    command: "/opt/factorio/bin/x64/factorio --start-server opt/saves/my-save.zip"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4.0"
    ports:
      - "34197:34197/udp"
    tty: true

  factorio_space_age:
    container_name: factorio_space_age_server
    build:
      context: ./buildfiles
      dockerfile: Dockerfile.factorio
    ports:
      - "34197:34197/udp"
    tty: true

  satisfactory:
    container_name: satisfactory_server
    build:
      context: ./buildfiles
      dockerfile: Dockerfile.java
    tty: true

  astroneers:
    container_name: astroneers_server
    build:
      context: ./buildfiles
      dockerfile: Dockerfile.java
    tty: true

  screeps:
    container_name: screeps_server
    build:
      context: ./buildfiles
      dockerfile: Dockerfile.java
    tty: true

  frontend:
    container_name: frontend_server
    volumes: ["./src/app:/src/app", "./src/lib:/src/lib", "./resources:/resources"]
    networks:
      - frontend
    ports: 
     - 5000:8043/tcp
     - 2024:2024/udp
    build:
      context: ./buildfiles
      dockerfile: Dockerfile.frontend
    tty: true
    command: ["bash", "-c", "source ../opt/venv/bin/activate; pwd; flask --app src.app.app run --host=0.0.0.0 --port 8043"]

volumes:
  socket_connection:

networks:
  frontend:
    driver: bridge